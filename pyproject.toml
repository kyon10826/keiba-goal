[project]
name = "keiba-goal"
version = "0.1.0"
description = "JRA 単勝・複勝の券種別確率モデルと目標到達型 (Goal-reaching) の買い目推奨"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.3,<2.4",
    "scipy>=1.15,<1.17",
    "pandas>=2.3,<3",
    "polars>=1.36,<2",
    "pyarrow>=18",
    "scikit-learn>=1.6,<1.8",
    "lightgbm>=4.6,<5",
    "xgboost>=2.1,<3",
    "catboost>=1.2.8,<1.3",
    "flaml[automl]>=2.3,<3",
    "optuna>=4.5,<5",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
keiba-goal = "keiba_goal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keiba_goal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
